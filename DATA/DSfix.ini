# You can configure DSfix by editing this file
# Lines starting with "#" are ignored by the program and contain descriptions of the options

###############################################################################
# Graphics Options
###############################################################################

# internal rendering resolution of the game
# higher values will decrease performance
renderWidth 1920
renderHeight 1080

# The display width/height
# 0 means use the same resolution as renderWidth/Height
# (use for downscaling - if in doubt, leave at 0)
presentWidth 0
presentHeight 0

############# Anti Aliasing

# AA toggle and quality setting
# 0 = off (best performance, worst IQ)
# 1 = low 
# 2 = medium
# 3 = high
# 4 = ultra (worst performance, best IQ)
aaQuality 4

# AA type
# either "SMAA" or "FXAA"
aaType SMAA

############# Sharpening 
# for the 3D image after anti-aliasing (the HUD and menus are not sharpened).
# 0 = off (default). Try 0.3 to 0.5; 1.0 is the maximum.
sharpenStrength 0.00

############# Ambient Occlusion

# Enable and set the strength of the SSAO effect (all 3 settings have the same performance impact!)
# 0 = off
# 1 = low
# 2 = medium
# 3 = high
ssaoStrength 2

# Set SSAO scale
# 1 = high quality (default)
# 2 = lower quality, lower impact on performance
# 3 = lowest quality, lowest impact on performance
ssaoScale 1

# Determine the type of AO used
# "VSSAO" = Volumetric SSAO (default, only option pre-1.9)
# "HBAO" = Horizon-Based Ambient Occlusion
# "SCAO" = VSSAO + HBAO
# "VSSAO2" = Volumetric SSAO with more samples (tweaked by Asmodean)
# VSSAO and  HBAO types have a slightly different effect. and similar performance
# SCAO combines both, with a higher performance impact
# VSSAO2 is generally more accurate, but also requires more performance

ssaoType SCAO

############# Depth of field

# Depth of Field resolution override, possible values:
# 0 = no change from default (DoF pyramid starts at 512x360)
# 540 = DoF pyramid starts at 960x540
# 810 = DoF pyramid starts at 1440x810
# 1080 = DoF pyramid starts at 1920x1080
# 2160 = DoF pyramid starts at 3840x2160
# higher values will decrease performance
# do NOT set this to the same value as your vertical rendering resolution!
dofOverrideResolution 810

# Depth of Field scaling override (NOT RECOMMENDED)
# 0 = DoF scaling enabled (default, recommended)
# 1 = DoF scaling disabled (sharper, worse performance, not as originally intended)
disableDofScaling 0

# Depth of field additional blur
# allows you to use high DoF resolutions and still get the originally intended effect
# suggested values:
# o (off) at default DoF resolution
# 0 or 1 at 540 DoF resolution
# 1 or 2 above that
# 3 or 4 at 2160 DoF resolution (if you're running a 680+)
dofBlurAmount 1

############# Framerate

# Enable variable framerate (up to 60)
# NOTE:
# - this requires in-memory modification of game code, and may get you banned from GFWL
# - there may be unintended side-effects in terms of gameplay
# - you need a very powerful system (especially CPU) in order to maintain 60 FPS
# - in some  instances, collision detection may fail. Avoid sliding down ladders
# Use this at your own risk!
# 0 = no changes to game code
# 1 = unlock the frame rate
unlockFPS 1

# FPS limit, only used with unlocked framerate
# do not set this much higher than 60, this will lead to various issues with the engine
FPSlimit 60

# FPS threshold
# DSfix will dynamically disable AA if your framerate drops below this value 
#  and re-enable it once it has normalized (with a bit of hysteresis thresholding)
FPSthreshold 28

############# Filtering

# texture filtering override
# 0 = no change 
# 1 = enable some bilinear filtering (use only if you need it!)
# 2 = full AF override (may degrade performance)
# if in doubt, leave this at 0
filteringOverride 0

###############################################################################
# HUD options
###############################################################################

# Enable HUD modifications
# 0 = off (default) - none of the options below will do anything!
# 1 = on
enableHudMod 0

###############################################################################
# HUD Scaling
# WARNING: Independent HUD scaling is experimental. 
# Changing these values to anything other than 1.0 WILL break Boss Health Bars 
# and Dialogue boxes due to game engine limitations. Change at your own risk.
# 1.0 = 100% (default size), 0.75 = 75% size, 0.5 = 50% size, etc.

# Top Left: Health bar, stamina bar, and humanity counter
hudScaleTopLeft 0.85

# Bottom Left: Equipped items, weapons, shields, and magic slots
hudScaleBottomLeft 0.80

# Bottom Right: Current souls count
hudScaleBottomRight 0.80

#Boss health bar
hudScaleBottomCenter 0.85

#top right quick menu and the inventory/status windows  
menuScale 0.90

#bonfire menu and the other list windows on the left side of the screen
listWindowScale 0.90

#interaction prompts, Yes/No questions
promptScale 0.90

#NPC dialogue subtitles
subtitleScale 0.85

###############################################################################
# Set opacity for different elements of the HUD
# 1.0 = fully opaque
# 0.0 = fully transparent
# Top left: health bars, stamina bar, humanity counter, status indicators
hudTopLeftOpacity 1
# Bottom left: item indicators & counts
hudBottomLeftOpacity 1
# Bottom right: soul count 
hudBottomRightOpacity 1

###############################################################################
# Controller Button Prompt Swap
###############################################################################
# This swaps only the icons in the game. For swapping functionality, you must
# use a controller configurator.

# In-game swap cross and circle (A and B) button icons.
swapConfirmIcons 0

# In-game swap square and triangle (X and Y) button icons.
swapXYIcons 0

# Controller button icons (button prompts and quick menu), built into DSfix.
# off         - the game's icons, or your own 40fbc4ad / 43a2b23a files in tex_override
# auto        - detects the controller connected at game start (PlayStation, Switch Pro or Xbox).
#               No controller found: same as off
# xbox, playstation, switch - always use that icon set
# When an icon set is used, tex_override files with those two names are ignored.
controllerIcons auto

# Keyboard / mouse icons in game. Only works with DDTMControllerFix.dll.
# While you use keyboard and mouse, the button prompts and the quick menu
# LB / RB icons show your keys from DDTMControllerMappings.ini.
# The controller - the face buttons, LB / RB and LT / RT show the real
# With DDTMControllerFix.dll, swapConfirmIcons and swapXYIcons are then not used.
# 0 = off, 1 = on
DDTMControllerMappings 1

###############################################################################
# Window & Mouse Cursor Options
###############################################################################

# borderless fullscreen mode 
# make sure to select windowed mode in the game settings for this to work!
# 0 = disable
# 1 = enable
borderlessFullscreen 1

# disable cursor at startup
# 0 = no change
# 1 = off at start
disableCursor 1

# capture cursor (do not allow it to leave the window)
# 0 = don't capture
# 1 = capture
# (this also works if the cursor is not visible)
captureCursor 0

# EnableVsync and fullscreenHz only act when the game itself is in fullscreen mode
# Dark Souls can only use G-Sync or FreeSync in its own fullscreen mode (not in a window or borderless)
# With G-Sync or FreeSync: 
# untick Borderless Fullscreen, set the game to fullscreen, VSync on, Refresh Rate at monitor max, 
# FPS limit a few below it.
# Without G-Sync or FreeSync: 
# Fullscreen or Borderless both are fine but unlike G-Sync, 
# you must put an FPS limit that divides your refresh rate evenly (e.g. 60 on 60/120/180/240 Hz).

# Vsync: -1 = leave the game's choice (default), 0 = off, 1 = on
enableVsync 1

# Refresh rate in the game's fullscreen mode: 0 = leave the game's choice (default),
# or a value such as 120, 144, 165, 180. DSfix checks it against the rates your monitor
# supports and uses the highest one that is not above this value.
fullscreenHz 180

###############################################################################
# Save Game Backup Options
###############################################################################

# enables save game backups
# 0 = no backups
# 1 = backups enabled
# backups are stored in the save folder, as "[timestamp]_[original name].bak"
enableBackups 1

# backup interval in seconds (1500 = 25 minutes)
# (minimum setting 600)
backupInterval 1400

# maximum amount of backups, older ones will be deleted
maxBackups 10


# Backup Path
###############################################################################

# Override the save folder if DSfix cannot find it automatically.
# Point this directly to the exact folder containing your .sl2 file.
# If save backups are failing to generate, insert your custom path here 
# Windows environment variables are supported.
# Leave as 'none' to use the original DSfix 2.4 hardcoded path detection. 
# Example: %USERPROFILE%\Documents\NBGI\DarkSouls\[YourCustomFolderName] (the folder must exist)
customSaveFolder %USERPROFILE%\Documents\NBGI\DarkSouls

###############################################################################
# Texture Override Options
###############################################################################

# enables texture dumping
# you *only* need this if you want to create your own override textures
# textures will be dumped to "dsfix\tex_override\[hash].tga"
enableTextureDumping 0

# enables texture override
# textures in "dsfix\tex_override\[hash].png" will replace the corresponding originals
# will cause a small slowdown during texture loading!
enableTextureOverride 1

# enables texture prefetch if texture override is turned on
# textures will be preloaded into memory at startup
# no disk overhead when loading them when entering new area (little performance boost)
enableTexturePrefetch 0

###############################################################################
# Shader Override Options
###############################################################################

# Enable shader dumping
# Disassembled pixel shaders will be dumped to
# "dsfix\pixelshader_dump\[hash].asm", vertex shaders to
# "dsfix\vertexshader_dump\[hash].asm".
enableShaderDumping 0

# Enable pixel shader override
# Shaders from files named "dsfix\pixelshader_override\[hash].asm" or
# "dsfix\vertexshader_override\[hash].asm" will replace the
# corresponding originals.
enableShaderOverride 0

###############################################################################
# Other Options
###############################################################################

# skip the intro logos
# this should now be slightly more stable, but should still be
# the first thing to disable in case you experience any problems
skipIntro 1

# change the screenshot directory
# default: . (current directory)
# example: C:\Users\Peter\Pictures
# directory must exist!
screenshotDir .

# override the in-game language
# none = no override
# en-GB = English, fr = French, it = Italian, de = German, es = Spanish
# ko = Korean, zh-tw = Chinese, pl = Polish, ru = Russian
# this does not work in Windows XP!
overrideLanguage none

# Dinput dll chaining
# if you want to use another dinput8.dll wrapper together
# with DSfix, rename it (e.g. "dinputwrapper.dll") and put the new name here
# with 'none' you use the default input from dsfix 2.4
dinput8dllWrapper DDTMControllerFix.dll

# D3D adapter override
# -1 = no override
# N = use adapter N
# this setting is for multiple (non-SLI/crossfire) GPUs
# everyone else should leave it at -1
d3dAdapterOverride -1

# Log level - 0 to 11, higher numbers mean more logging
# only enable for debugging
logLevel 0


# consumables you pick up are no longer put into your quick item slots automatically (Estus unchanged). 
# 1 = On; 0 = as before
disableItemAutoEquip 0

# thin bar under each weapon slot showing durability left (bottom-left HUD). 
# 1 = show the bars; 0 = off
weaponWearBars 1

# use several of the same item at once (master switch).
# In the pause Inventory menu, using a listed item asks how many to use and uses
# them all with a single animation. The quick-item button during play behaves as
# before, and any item that is not listed keeps its normal behaviour, so Boss Souls
# and Fire Keeper Souls still ask their own Yes/No question. The number offered is
# never more than you own and never so many that the reward would be lost at the
# game's limit. Owning only one uses it straight away with no question.
# 1 = On; 0 = as before
bulkItemUse 0

# The two groups bulkItemUse covers. They only matter when bulkItemUse is 1.
# A group set to 0 is not merely idle - the game code behind it is never touched.

# the ten ordinary soul items, Soul of a Lost Undead up to Soul of a Great Hero
standardSoulsBulk 1

# Humanity and Twin Humanities (the number offered never passes the 99 humanity cap)
humanityBulk 1

# offer covenant items or Humanity in bulk with a quantity picker. 
# It stops just short of each rank, so every rank-up reward still arrives exactly as in vanilla.
# 1 = On; 0 = as before
covenantOfferings 0

# quick save: while playing, quickSaveKey makes the game save and copies your character to QuickSave\QS_DRAKS0005
# next to the save file (only that character; every quick save replaces the last one)
# 1 = On; 0 = off
quickSave 0

# the key for quick save (key names as in DSfixKeys.ini: VK_F5, VK_F6, ...)
quickSaveKey VK_F5

# the key for quick load (needs quickSave 1); 
# press it while playing (twice within 3 seconds, see below). The game goes to the
# title screen, the quick save is put back and loaded automatically. Your save as it was just before is kept in
# QuickSave\BeforeQuickLoad..._DRAKS0005.sl2.bak. none = off
quickLoadKey VK_F9

# quick load: 1 = press quickLoadKey twice within 3 seconds (safer against a press by mistake); 0 = one press loads at once
quickLoadDoublePress 1

# WeaponsArmorSort: sort the Weapons and Armor lists of the Inventory, the Equipment
# and the Bottomless Box.
# Values: Game Order, physical, magic, fire, lightning, durability, weight,
# and in the Bottomless Box also Storage.
# The choice is remembered in %LOCALAPPDATA%\NBGI\DarkSouls\DSfixSort.ini
# 0 = off (nothing is patched), 1 = on
WeaponsArmorSort 0

# BottomlessBoxMarkers: in the Bottomless Box list, a small chest picture in the top-right corner of an item's picture
# when nothing of it is held and all of it is in the box. 0 = off (nothing is patched)
BottomlessBoxMarkers 0

# hold D-pad Down during play to select the Estus Flask in your quick-item slots.
# A tap still switches to the next item. With DDTM, its SWITCH_ITEM key works the same.
# 1 = On; 0 = off
QuickSelectEstus 0

# "Enter Covenant" in the bonfire list: switch to a covenant you already joined in this playthrough.
# Same Yes/No question and result as the leaders (the devotion of the covenant you leave is halved).
# Broken covenants (leader dead or hostile, banished, ...) are not offered. Resets in NG+.
# 1 = On; 0 = off
BonfireCovenants 0
